.battle{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(180deg,#07101dcc,#111b35ee);z-index:35;pointer-events:auto}.battle.show{display:flex}.battlebox{width:min(950px,94vw);background:linear-gradient(180deg,#172544f5,#0b1227f8);border:1px solid #7f96cf;border-radius:22px;padding:16px;box-shadow:0 25px 90px #000e}.battleScene{height:246px;border-radius:18px;background:radial-gradient(circle at 70% 22%,#375184,#0c1730 58%,#050914);border:1px solid #4c659d;position:relative;overflow:hidden}.battleCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}.battleHud{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.battleBtns button{flex:1 1 145px;min-height:62px}.enemyTip{border:1px solid #ffe38f77;background:#201b0dcc;border-radius:12px;padding:8px;margin-top:8px;font-size:12px;color:#fff4bf}.warning{animation:warn 1s infinite}@keyframes warn{50%{filter:brightness(1.6);box-shadow:0 0 22px #ff758d}}

<body>
<div id="wrap">
  <canvas id="game" width="960" height="540" aria-label="星屑のレガリア ゲーム画面"></canvas>
  <div class="ui">
    <div class="topbar"><div class="panel stat" id="statPanel"></div><div class="panel side" id="sidePanel"></div></div>
    <div class="panel questbox" id="questPanel"></div>
    <div class="objective" id="objective"><div class="label">NEXT OBJECTIVE</div><div class="goal">星のかけらを拾おう</div><div class="sub">光の矢印を追えば迷いません</div></div>
    <div class="lowHp" id="lowHp"></div>
    <div class="panel log" id="logPanel"></div>
    <div class="panel help"><b>操作</b> 左下ジョイスティックで移動。マップをタップでA*自動移動。右下の大ボタンで調べる・会話・採集。</div>
    <div class="hint">巨大島探索 / タップで自動移動 / 右下で調べる</div>
    <div class="touchControls">
      <div class="joy" id="joy"><div class="joyBase"></div><div class="joyRing"></div><div class="joyKnob" id="joyKnob"></div></div>
      <div class="quick">
        <button class="main" data-act="interact">調べる / 採集</button>
        <button data-act="menu">メニュー</button><button data-act="quests">クエスト</button>
        <button data-act="story">目的</button><button data-act="map">地図</button>
        <button class="save" data-act="save">セーブ</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <div class="cutin" id="cutin"></div>
  <div class="overlay show" id="titleOverlay">
    <div class="modal" style="text-align:center;max-width:780px">
      <div class="title">星屑のレガリア</div>
      <div class="subtitle">V16 Ultimate 完全版：探索・戦闘・物語・保存を全部入りにした2D探索RPG</div>
      <div class="titleArt">🌠 ⚔️ 🌅</div>
      <p style="color:#d7e4ff;line-height:1.65">星を失った巨大島アステリアを巡り、古代装置レガリアを修復しよう。<br>最終目標は、宵闇城で宵闇の王を倒し、島に夜明けを取り戻すことです。</p>
      <div class="nameSetup"><label for="nicknameInput">冒険者のニックネーム</label><input id="nicknameInput" maxlength="12" value="こじこじ" autocomplete="nickname" inputmode="text" /></div>
      <div class="btnrow" style="justify-content:center"><button id="newGame">新しく始める</button><button id="continueGame" class="ok">続きから</button><button id="importTitle" class="purple">セーブコードで続き</button><button id="howTo" class="ghost">遊び方</button></div>
    </div>
  </div>
  <div class="overlay" id="menuOverlay"><div class="modal" id="menuContent"></div></div>
  <div class="battle" id="battleOverlay"><div class="battlebox">
    <h2 id="battleTitle">戦闘</h2>
    <div class="battleScene"><canvas id="battleCanvas" class="battleCanvas" width="920" height="246"></canvas></div>
    <div class="battleHud"><div class="card" id="battleHero"></div><div class="card" id="battleEnemy"></div></div>
    <div class="enemyTip" id="enemyTip"></div>
    <div class="btnrow battleBtns" id="battleBtns"></div>
  </div></div>
</div>

function tileCanvas(type,variant){const key=type+':'+variant;if(tileCache.has(key))return tileCache.get(key);const c=document.createElement('canvas'),g=c.getContext('2d');c.width=TILE;c.height=TILE;const grad=g.createLinearGradient(0,0,TILE,TILE);const pal={0:['#348b52','#236d42'],1:['#2871a5','#123b69'],2:['#245f3e','#123c29'],3:['#6a7282','#3f4656'],4:['#9a7745','#6d512f'],5:['#65708c','#43506a'],6:['#2d3149','#151827'],7:['#d7bd77','#aa8f4f'],8:['#62251f','#2a1517'],9:['#eef8ff','#c6d6e7'],10:['#416b5e','#233e3b']}[type]||['#348b52','#236d42'];grad.addColorStop(0,pal[0]);grad.addColorStop(1,pal[1]);g.fillStyle=grad;g.fillRect(0,0,TILE,TILE);g.globalAlpha=.16;g.fillStyle=variant%2?'#fff':'#000';g.fillRect(0,0,TILE,TILE);g.globalAlpha=1;if(type===T.WATER){g.strokeStyle='#b6f3ff88';for(let i=0;i<3;i++){g.beginPath();g.moveTo(3,8+i*8);g.quadraticCurveTo(14,6+i*8,29,9+i*8);g.stroke()}}if(type===T.FOREST){g.fillStyle='#0c2b1f';g.beginPath();g.arc(16,14,13,0,Math.PI*2);g.fill();g.fillStyle='#3fa75c';g.beginPath();g.arc(11,11,8,0,Math.PI*2);g.arc(21,13,9,0,Math.PI*2);g.fill();g.fillStyle='#6e4a2f';g.fillRect(15,18,3,10)}if(type===T.MOUNTAIN){g.fillStyle='#363c4c';g.beginPath();g.moveTo(3,29);g.lineTo(16,4);g.lineTo(30,29);g.fill();g.fillStyle='#aeb8cc';g.beginPath();g.moveTo(16,4);g.lineTo(11,16);g.lineTo(20,15);g.fill()}if(type===T.LAVA){g.strokeStyle='#ffb45a99';g.lineWidth=2;g.beginPath();g.moveTo(5,18);g.lineTo(14,12);g.lineTo(28,16);g.stroke()}if(type===T.SNOW){g.fillStyle='#fff8';for(let i=0;i<5;i++)g.fillRect((i*7+variant*3)%30,(i*11+variant)%28,2,2)}if(type===T.ROAD||type===T.TOWN){g.strokeStyle=type===T.TOWN?'#aab7df77':'#d2a96b66';for(let y=7;y<30;y+=9){g.beginPath();g.moveTo(3,y);g.lineTo(29,y+1);g.stroke()}}tileCache.set(key,c);return c}

function talk(n){log(`${n[1]}：${n[6]||n[5]}`);if(n[0]==='save'){save();return}const qid=n[5],q=S.quests[qid];if(q){if(!q.active&&!q.done&&canQuest(qid)){q.active=true;log(`クエスト開始：${q.name}`,'rare')}if(q.active&&!q.done){if(has(q.need))completeQuest(qid);else log(`進行中：${q.name}（${progressText(q.need)}）`)}}if(n[7])shop(n[7])}
function canQuest(id){if(id==='q2'||id==='q3'||id==='q6')return S.quests.q1.done;if(id==='q4')return placeCleared('tower');if(id==='q5')return S.quests.q4.done;if(id==='q7')return placeCleared('tower');return true}
function completeQuest(id){const q=S.quests[id];rem(q.need);q.done=true;q.active=false;reward(q.reward);log(`クエスト達成：${q.name}`,'rare');if(id==='q1'){S.tutorial.elder=true;ach('tutorialClear');S.quests.q2.active=true;S.quests.q3.active=true;S.quests.q6.active=true}if(id==='q4')learn('dragon',true);save()}
function openChest(c){S.flags.chests[c[0]]=true;S.stats.opened++;S.tutorial.treasure=true;reward(c[4]);log(`${c[1]}を開けた！`,'rare');burst(c[2],c[3],'#ffe38f',36);if(c[0]==='t0'&&!S.tutorial.battle)setTimeout(startFirstImpact,450);if(S.stats.opened>=6)ach('treasureHunter');if(S.stats.opened>=12)ach('treasureLord');save()}
function enterPlace(d){if(placeCleared(d[0])){log(`${d[1]}は攻略済み。奥で素材を見つけた。`,'good');addItem(d[0]==='mine'?'ore':d[0]==='tower'?'crystal':'shadow',1);return}if(d[4]&&!(S.inv[d[4]]||0)){toast(`${itemName(d[4])}が必要です`);log(`${d[1]}には${itemName(d[4])}が必要。`,'bad');return}startBattle(cloneEnemy(d[5]),d[0])}
function gather(){const tile=map[S.player.y][S.player.x];let table=[];const luck=(S.relics.fortune?1.45:1)*(S.daily.boost==='素材ドロップ2倍'?2:1);if(nearWater())table=[['fish',.62*luck],['pearl',.08*luck],['herb',.12]];else if(tile===T.GRASS||tile===T.ROAD)table=[['herb',.62*luck],['wood',.22],['slimeCore',.05*luck]];else if(tile===T.FOREST)table=[['herb',.44*luck],['wood',.48],['hide',.1*luck],['crystal',.04*luck]];else if(tile===T.MOUNTAIN)table=[['ore',.62],['crystal',.14*luck],['wood',.08],['stardust',.025*luck]];else if(tile===T.SNOW)table=[['frost',.4],['crystal',.18*luck],['herb',.12],['stardust',.025*luck]];else if(tile===T.LAVA)table=[['ember',.42],['ore',.24],['crystal',.09*luck],['stardust',.025*luck]];else if(tile===T.SWAMP)table=[['shadow',.24*luck],['slimeCore',.2],['crystal',.07*luck],['ancientCoin',.025*luck]];if(!table.length){toast('ここでは採集できません');return}let got=false;for(const[id,p]of table){if(ch(p)){addItem(id,1);got=true;S.stats.gathered++;if(id==='fish'||id==='pearl')S.stats.fish++}}if(!got)log('何も見つからなかった。');else{S.player.energy=cl(S.player.energy+2,0,S.player.maxEnergy);if(Object.values(S.inv).reduce((a,b)=>a+b,0)>=30)ach('collector')}if(ch(.07))startBattle(pickEnemy(tile));dirty=true}
function cloneEnemy(id){const e=DATA.enemies[id];return {id,name:e[0],emoji:e[1],lv:e[2],hp:e[3],maxHp:e[3],atk:e[4],def:e[5],xp:e[6],gold:e[7],drops:deep(e[8]),biomes:e[9],tip:e[10],boss:!!e[11],warn:false}}
function pickEnemy(tile){let list=Object.keys(DATA.enemies).filter(id=>!DATA.enemies[id][11]&&DATA.enemies[id][9].includes(tile));if(!list.length)list=['slime','wolf'];if(ch(.035))return cloneEnemy('mimic');return cloneEnemy(list[rand(0,list.length-1)])}
function startFirstImpact(){if(S.tutorial.battle||inBattle)return;S.flags.firstImpact=true;showCutin('星落下イベント 🌠');log('星屑スライムが現れた！','bad');setTimeout(()=>{if(!inBattle&&!S.tutorial.battle)startBattle(cloneEnemy('firstSlime'),'intro')},500)}
function startBattle(enemy,placeId=null){inBattle=true;battle={enemy,placeId,turn:'player',def:false,motion:null};S.codex.enemies[enemy.id]=S.codex.enemies[enemy.id]||{seen:1,defeated:0};if(S.relics.comet)S.player.energy=cl(S.player.energy+20,0,S.player.maxEnergy);$('battleOverlay').classList.add('show');if(enemy.boss)showCutin(enemy.name+' '+enemy.emoji);log(`${enemy.name}が現れた！`,'bad');renderBattle()}
function showCutin(txt){const c=$('cutin');c.textContent=txt;c.classList.add('show');clearTimeout(showCutin.t);showCutin.t=setTimeout(()=>c.classList.remove('show'),1000)}
function renderBattle(){const e=battle.enemy,p=S.player;$('battleTitle').textContent=(e.boss?'BOSS：':'戦闘：')+e.name;$('battleHero').innerHTML=`<h3>${p.name}</h3><p>HP ${p.hp}/${stat('maxHp')} / MP ${p.mp}/${stat('maxMp')}</p><div class="bar"><div class="fill" style="width:${p.hp/stat('maxHp')*100}%"></div></div><div class="bar"><div class="fill mp" style="width:${p.mp/stat('maxMp')*100}%"></div></div><div class="bar"><div class="fill en" style="width:${p.energy/p.maxEnergy*100}%"></div></div><p class="small">奥義 ${p.energy}/${p.maxEnergy}</p>`;$('battleEnemy').innerHTML=`<h3>${e.emoji} ${e.name} Lv.${e.lv}</h3><p>HP ${Math.max(0,e.hp)}/${e.maxHp}</p><div class="bar"><div class="fill" style="width:${e.hp/e.maxHp*100}%"></div></div><p class="small">${e.tip}</p>`;$('enemyTip').textContent=e.warn?'敵が大技の準備中！このターンは防御がおすすめ。':'敵の特徴：'+e.tip;$('enemyTip').classList.toggle('warning',!!e.warn);const low=p.hp/stat('maxHp')<.35;const btns=[['⚔️ 攻撃',()=>playerAttack()],['🌠 奥義',()=>ultimate(),p.energy<100],['✨ スキル',()=>skillPicker()],['🧪 ポーション',()=>useItem('potion'),!S.inv.potion,low],['🏕️ キャンプ',()=>useItem('campKit'),!S.inv.campKit,low],['🛡️ 防御',()=>defend(),!e.warn?false:false],['🏃 逃げる',()=>run(),e.boss]];$('battleBtns').innerHTML='';for(const b of btns){const bt=document.createElement('button');bt.textContent=b[0];if(b[0].includes('奥義'))bt.className='gold';if(b[3])bt.classList.add('pulseBtn');bt.disabled=battle.turn!=='player'||!!b[2];bt.onclick=b[1];$('battleBtns').appendChild(bt)}}
function playerAttack(){if(battle.turn!=='player')return;damageEnemy(Math.max(1,Math.floor(stat('atk')*1.15-battle.enemy.def*.35+rand(3,8))),'slash','通常攻撃');endTurn()}
function ultimate(){if(S.player.energy<100)return;S.player.energy=0;S.stats.ult++;ach('ultimate');shake=16;showCutin('レガリア・ノヴァ');damageEnemy(stat('atk')*2.2+stat('matk')*2.2+rand(80,130),'star','レガリア・ノヴァ');if(inBattle)endTurn()}
function skillPicker(){const learned=Object.keys(DATA.skills).filter(id=>S.player.learned[id]);if(!learned.length){toast('まだスキルを覚えていません');return}const o=document.createElement('div');o.className='overlay show';o.style.zIndex=70;modalOpen=true;o.innerHTML=`<div class="modal"><h2>スキル</h2><div class="grid">${learned.map(id=>{const s=DATA.skills[id];return`<div class="card"><h3>${s[0]} MP${s[1]}</h3><p>${s[4]}</p><button data-skill="${id}" ${S.player.mp<s[1]?'disabled':''}>使う</button></div>`}).join('')}</div><button id="skillClose" class="ghost">閉じる</button></div>`;document.body.appendChild(o);$('skillClose').onclick=()=>{modalOpen=false;o.remove()};o.querySelectorAll('[data-skill]').forEach(b=>b.onclick=()=>{const id=b.dataset.skill;modalOpen=false;o.remove();useSkill(id)})}
function useSkill(id){const s=DATA.skills[id];if(S.player.mp<s[1])return;S.player.mp-=s[1];const type=s[3];if(type==='guard'){S.player.guard=2;log('鉄壁の構え！','good');endTurn();return}if(type==='heal'){heal(60+S.player.lv*8);endTurn();return}if(type==='focus'){mp(13+S.player.lv*2);S.player.energy=cl(S.player.energy+20,0,S.player.maxEnergy);S.player.focus=2;log('星の流れを読んだ。','good');endTurn();return}if(type==='dark'){damageEnemy(stat('atk')*.8+stat('matk')*.9+rand(18,26),'dark',s[0]);heal(20);if(inBattle)endTurn();return}const pow={slash:stat('atk')*1.55+rand(8,16),fire:stat('matk')*1.75+rand(12,22),ice:stat('matk')*1.85+rand(14,24),thunder:stat('atk')*1.8+rand(18,30),star:stat('atk')*1.45+stat('matk')*1.55+rand(28,46)}[type]||20;damageEnemy(pow,type,s[0]);if(inBattle)endTurn()}
function useItem(id){if(!S.inv[id])return;if(id==='potion')heal(45);if(id==='megaPotion')heal(110);if(id==='ether')mp(25);if(id==='campKit'){heal(140);mp(70)}S.inv[id]--;if(S.inv[id]<=0)delete S.inv[id];endTurn()}
function defend(){battle.def=true;log('防御した。次のダメージ半減。','good');endTurn()}
function damageEnemy(amount,type,label){const e=battle.enemy;let crit=ch((5+(S.player.focus?22:0)+critBonus())/100),mult=crit?1.75:1;if(type==='fire'&&e.id==='frostBear')mult*=1.35;if(type==='ice'&&e.id==='salamander')mult*=1.35;if(type==='star'&&e.boss)mult*=1.25;if(e.boss)for(const id of Object.values(S.player.equip)){const a=S.affix[id];if(a?.stat==='bossDmg')mult+=a.value}let dmg=Math.max(1,Math.floor(amount*mult-e.def*.3));e.hp-=dmg;S.player.energy=cl(S.player.energy+10,0,S.player.maxEnergy);fx.push({kind:'player',type,label,dmg,crit,life:0,max:type==='star'?86:50});log(`${e.name}に${dmg}ダメージ${crit?'！会心':''}`,'good');if(crit)shake=7;if(S.player.focus)S.player.focus--;if(e.hp<=0)winBattle()}
function critBonus(){let v=0;for(const id of Object.values(S.player.equip)){const a=S.affix[id];if(a?.stat==='crit')v+=a.value}return v}
function endTurn(){if(!inBattle)return;battle.turn='enemy';renderBattle();setTimeout(enemyTurn,650)}
function enemyTurn(){if(!inBattle)return;const e=battle.enemy,p=S.player;if(e.warn){e.warn=false;let dmg=Math.floor(e.atk*1.85-stat('def')*.35);if(battle.def)dmg=Math.floor(dmg*.45);if(p.guard)dmg=Math.floor(dmg*.55);hitPlayer(Math.max(1,dmg),'大技');return}if((e.boss||['golem','shade'].includes(e.id))&&ch(e.boss?.26:.16)){e.warn=true;log(`${e.name}が力をためている。防御しよう！`,'bad');battle.turn='player';renderBattle();return}let dmg=Math.max(1,Math.floor(e.atk*rand(80,120)/100-stat('def')*.38));if(battle.def){dmg=Math.floor(dmg*.5);battle.def=false}if(p.guard){dmg=Math.floor(dmg*.6);p.guard--}hitPlayer(dmg,'攻撃')}
function hitPlayer(dmg,label){S.player.hp-=dmg;S.player.energy=cl(S.player.energy+6,0,S.player.maxEnergy);fx.push({kind:'enemy',dmg,label,life:0,max:42});log(`${battle.enemy.name}の${label}。${dmg}ダメージ。`,'bad');shake=5;if(S.player.hp<=0){loseBattle();return}battle.turn='player';renderBattle()}
function run(){if(battle.enemy.boss)return;if(ch(.65)){log('逃げ切った。');endBattle()}else{log('逃げられなかった！','bad');endTurn()}}
function winBattle(){const e=battle.enemy;log(`${e.name}を倒した！`,'rare');S.stats.kills++;S.codex.enemies[e.id]=S.codex.enemies[e.id]||{seen:1,defeated:0};S.codex.enemies[e.id].defeated++;ach('firstBattle');gainXp(e.xp);gainGold(rand(e.gold[0],e.gold[1]));for(const[id,p]of Object.entries(e.drops||{})){if(ch(p))addItem(id,1)}if(e.id==='firstSlime'){S.tutorial.battle=true;log('次は村長リオへ！','rare')}if(e.boss){S.stats.boss++;if(battle.placeId&&battle.placeId!=='dailyBoss')S.flags.places[battle.placeId]=1;if(e.id==='bossMine'){ach('boss1');S.quests.q4.active=true}if(e.id==='bossTower'){ach('boss2');S.quests.q4.active=true;S.quests.q7.active=true}if(e.id==='bossFinal'){ach('final');ending()}if(e.id==='bossArena')ach('arena');if(e.id==='bossAbyss')ach('abyss');if(battle.placeId==='dailyBoss'){S.daily.boss=true;ach('dailyBoss')}}endBattle();save()}
function loseBattle(){log('倒れてしまった……星降り村へ運ばれた。','bad');S.player.hp=Math.floor(stat('maxHp')*.55);S.player.mp=Math.floor(stat('maxMp')*.45);S.player.x=12;S.player.y=16;S.player.fx=12;S.player.fy=16;S.player.gold=Math.floor(S.player.gold*.85);cam.ready=false;endBattle();save()}
function endBattle(){inBattle=false;battle=null;$('battleOverlay').classList.remove('show');dirty=true}
function drawBattleScene(){if(!battle)return;const e=battle.enemy;BX.clearRect(0,0,BC.width,BC.height);const g=BX.createLinearGradient(0,0,0,BC.height);g.addColorStop(0,'#172c55');g.addColorStop(.58,'#0b162d');g.addColorStop(1,'#050812');BX.fillStyle=g;BX.fillRect(0,0,BC.width,BC.height);for(let i=0;i<45;i++){BX.fillStyle=i%7?'#9de2ff66':'#ffe38f88';BX.fillRect((i*97+t*30)%BC.width,(i*47+Math.sin(t+i)*9)%130,2,2)}BX.fillStyle='rgba(0,0,0,.35)';BX.beginPath();BX.ellipse(225,185,70,14,0,0,Math.PI*2);BX.ellipse(690,185,e.boss?92:70,16,0,0,Math.PI*2);BX.fill();drawHeroB(225,145);drawEnemyB(e,690,140);drawBattleFx()}
function drawHeroB(x,y){BX.save();BX.translate(x,y);BX.fillStyle='#2f72ff';BX.beginPath();BX.ellipse(0,0,32,45,0,0,Math.PI*2);BX.fill();BX.strokeStyle='#ffe38f';BX.lineWidth=5;BX.beginPath();BX.moveTo(28,0);BX.lineTo(75,-42);BX.stroke();BX.fillStyle='#f3cf9e';BX.beginPath();BX.arc(0,-48,17,0,Math.PI*2);BX.fill();BX.fillStyle='#2b1d17';BX.beginPath();BX.arc(0,-57,18,Math.PI,0);BX.fill();BX.restore()}
function drawEnemyB(e,x,y){BX.save();BX.translate(x+Math.sin(t*8)*(e.warn?7:0),y);const col=e.boss?'#7b2645':e.id.includes('slime')?'#3fcf7a':e.id.includes('golem')?'#6d7485':e.id.includes('shade')?'#35264e':'#8b6a48';BX.fillStyle=col;BX.shadowColor=e.warn?'#ff758d':'#000';BX.shadowBlur=e.warn?25:0;BX.beginPath();BX.ellipse(0,0,e.boss?65:48,e.boss?56:40,0,0,Math.PI*2);BX.fill();BX.shadowBlur=0;BX.fillStyle='#fff';BX.font=e.boss?'52px serif':'42px serif';BX.textAlign='center';BX.textBaseline='middle';BX.fillText(e.emoji,0,0);BX.restore()}
function drawBattleFx(){fx=fx.filter(f=>{f.life++;const u=f.life/f.max;BX.save();BX.globalAlpha=1-u;if(f.kind==='player'){const col={slash:'#fff',fire:'#ff9b55',ice:'#9de2ff',thunder:'#fff56d',dark:'#c8a4ff',star:'#ffe38f'}[f.type]||'#fff';BX.strokeStyle=col;BX.fillStyle=col;BX.shadowColor=col;BX.shadowBlur=22;BX.lineWidth=f.type==='star'?7:5;if(f.type==='star'){for(let i=0;i<16;i++){const a=i*Math.PI*2/16+t;BX.beginPath();BX.arc(690+Math.cos(a)*(30+u*110),140+Math.sin(a)*(20+u*80),6,0,Math.PI*2);BX.fill()}BX.beginPath();BX.arc(690,140,45+u*120,0,Math.PI*2);BX.stroke()}else{BX.beginPath();BX.arc(690,140,35+u*80,-.8,.8);BX.stroke();BX.beginPath();BX.arc(690,140,20+u*50,2.3,4.0);BX.stroke()}BX.font='bold 28px system-ui';BX.textAlign='center';BX.fillText(Math.floor(f.dmg)+(f.crit?' CRIT':''),690,86-u*30)}else{BX.strokeStyle='#ff758d';BX.lineWidth=6;BX.shadowColor='#ff758d';BX.shadowBlur=18;BX.beginPath();BX.moveTo(180-u*45,110);BX.lineTo(270+u*45,180);BX.moveTo(270+u*45,110);BX.lineTo(180-u*45,180);BX.stroke();BX.fillStyle='#ffbec9';BX.font='bold 24px system-ui';BX.textAlign='center';BX.fillText(Math.floor(f.dmg),225,92-u*24)}BX.restore();return f.life<f.max})}
function showMenu(tab='status'){$('menuOverlay').classList.add('show');renderMenu(tab)}function closeMenu(){$('menuOverlay').classList.remove('show')}
function renderMenu(tab){const tabs=[['status','ステータス'],['story','目的'],['daily','デイリー'],['items','アイテム'],['equip','装備'],['skills','スキル'],['craft','クラフト'],['relics','レリック'],['quests','クエスト'],['codex','図鑑'],['ach','実績'],['system','システム']];$('menuContent').innerHTML=`<h2>メニュー</h2><div class="tabs">${tabs.map(([id,n])=>`<button class="tab ${id===tab?'active':''}" data-tab="${id}">${n}</button>`).join('')}<button id="closeMenu" class="danger">閉じる</button></div><div id="menuBody"></div>`;$('closeMenu').onclick=closeMenu;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderMenu(b.dataset.tab));const body=$('menuBody');body.innerHTML=({status:statusHTML,story:storyHTML,daily:dailyHTML,items:itemsHTML,equip:equipHTML,skills:skillsHTML,craft:craftHTML,relics:relicHTML,quests:questsHTML,codex:codexHTML,ach:achHTML,system:systemHTML}[tab]||statusHTML)();wireMenu()}
function statusHTML(){const p=S.player,rate=Math.floor(Object.keys(S.seen).length/(MW*MH)*100);return`<div class="grid"><div class="card"><h3>${p.name}</h3><p>Lv.${p.lv} / ${p.gold}G / SP ${p.sp}</p><p>HP ${p.hp}/${stat('maxHp')} / MP ${p.mp}/${stat('maxMp')}</p><p>ATK ${stat('atk')} / MATK ${stat('matk')} / DEF ${stat('def')}</p><p>歩数 ${p.steps} / 撃破 ${S.stats.kills} / 宝箱 ${S.stats.opened}</p></div><div class="card"><h3>やり込みカード</h3><p>探索率 ${rate}%</p><p>宝箱回収 ${S.stats.opened}/${CHESTS.length}</p><p>討伐数 ${S.stats.kills} / ボス ${S.stats.boss}</p><p>釣り ${S.stats.fish} / クラフト ${S.stats.crafted}</p></div><div class="card"><h3>装備中</h3>${Object.entries(p.equip).map(([s,id])=>`<p>${slotName(s)}：${id?equipName(id):'なし'}</p>`).join('')}</div></div>`}
function storyHTML(){const route=['星のかけらを拾う','宝箱を開ける','初戦闘を突破する','村長リオへ報告','古鉱山を攻略','星見塔でレガリア入手','レガリア修復','宵闇城で最終決戦','クリア後：深淵・闘技場・レリック'];return`<div class="grid"><div class="card"><h3>今やること</h3><p class="spark">${mainGoal()}</p><p>光の矢印、足元の光、ミニマップの黄色マーカーを追うと迷いません。</p></div><div class="card"><h3>物語の流れ</h3>${route.map((r,i)=>`<p>${i<storyIndex()?'✓':i===storyIndex()?'▶':'・'} ${r}</p>`).join('')}</div><div class="card"><h3>最終目標</h3><p>宵闇城で宵闇の王を倒し、アステリアに夜明けを取り戻す。</p></div></div>`}
function storyIndex(){if(!S.tutorial.star)return 0;if(!S.flags.chests.t0)return 1;if(!S.tutorial.battle)return 2;if(!S.quests.q1.done)return 3;if(!placeCleared('mine'))return 4;if(!placeCleared('tower'))return 5;if(!S.quests.q4.done)return 6;if(!placeCleared('castle'))return 7;return 8}
function dailyHTML(){return`<div class="grid"><div class="card"><h3>今日のボーナス</h3><p><span class="badge">${S.daily.boost}</span><span class="badge">連続${S.daily.streak}日</span></p><p>村の近くにデイリー宝箱：${S.daily.chest?'開封済み':'未開封'}</p></div><div class="card"><h3>日替わりボス</h3><p>1日1回、報酬多めの強敵に挑戦。</p><button id="dailyBoss" ${S.daily.boss?'disabled':''}>挑戦する</button></div></div>`}
function itemsHTML(){const rows=Object.entries(S.inv).map(([id,n])=>`<tr><td>${itemName(id)}</td><td>${n}</td><td>${DATA.items[id]?.[1]||''}</td><td>${DATA.items[id]?.[2]==='use'?`<button data-use="${id}">使う</button>`:''}</td></tr>`).join('');return rows?`<table><tr><th>名前</th><th>数</th><th>説明</th><th></th></tr>${rows}</table>`:'<p>アイテムなし</p>'}
function equipHTML(){let rows='';for(const id of Object.keys(S.equips)){const e=DATA.equip[id];if(!e)continue;rows+=`<tr><td>${equipName(id)} x${S.equips[id]}<br><span class="badge">${equipRarity(id)}</span></td><td>${slotName(e[1])}</td><td>ATK ${e[2]} / MATK ${e[3]} / DEF ${e[4]}</td><td>${e[6]}<br><span class="spark">${affixText(id)}</span></td><td><button data-equip="${id}">装備</button></td></tr>`}return`<table><tr><th>装備</th><th>部位</th><th>性能</th><th>説明</th><th></th></tr>${rows}</table>`}
function skillsHTML(){return`<div class="grid">${Object.entries(DATA.skills).map(([id,s])=>{const learned=S.player.learned[id],can=S.player.lv>=s[2]&&S.player.sp>0&&!learned;return`<div class="card"><h3>${learned?'✓ ':''}${s[0]}</h3><p>${s[4]}</p><p>必要Lv ${s[2]} / MP ${s[1]}</p><button data-learn="${id}" ${can?'':'disabled'}>${learned?'習得済み':'SP1で習得'}</button></div>`}).join('')}</div>`}
function craftHTML(){const rec={potion:['ポーションx2',{herb:3},{items:{potion:2}}],ironSword:['星鉄の剣',{ore:5,wood:2},{equip:'ironSword'}],ironArmor:['星鉄の鎧',{ore:6,hide:4},{equip:'ironArmor'}],emberBlade:['紅蓮の刃',{ore:7,ember:3,crystal:1},{equip:'emberBlade'}],frostRobe:['氷霜のローブ',{hide:6,frost:3,crystal:1},{equip:'frostRobe'}],auroraBlade:['オーロラブレード',{ore:12,crystal:7,stardust:3,ancientCoin:1},{equip:'auroraBlade'}],dragonArmor:['竜鱗の鎧',{hide:12,ember:4,frost:4,shadow:2},{equip:'dragonArmor'}],voidRing:['虚空の指輪',{shadow:5,pearl:2,stardust:4},{equip:'voidRing'}]};return`<div class="grid">${Object.entries(rec).map(([id,r])=>`<div class="card"><h3>${r[0]}</h3><p>材料：${progressText(r[1])}</p><button data-craft="${id}" ${has(r[1])?'':'disabled'}>作る</button></div>`).join('')}</div>`}
function relicHTML(){return`<div class="grid">${Object.entries(DATA.relics).map(([id,r])=>`<div class="card"><h3>${S.relics[id]?'✦ ':''}${r[0]}</h3><p>${r[1]}</p><p>必要：${progressText(r[2])}</p><button data-relic="${id}" ${!S.relics[id]&&has(r[2])?'':'disabled'}>${S.relics[id]?'解放済み':'解放する'}</button></div>`).join('')}</div>`}
function questsHTML(){return`<div class="grid">${Object.values(S.quests).map(q=>`<div class="card"><h3>${q.done?'✓ ':''}${q.name}</h3><p>${q.desc}</p><p>依頼人：${q.npc}</p><p>${q.done?'完了':q.active?progressText(q.need):'未発生'}</p></div>`).join('')}</div>`}
function codexHTML(){const enemies=Object.entries(DATA.enemies).map(([id,e])=>{const seen=S.codex.enemies[id];return`<div class="card"><h3>${seen?e[1]:'❔'} ${seen?e[0]:'未発見の敵'}</h3><p>${seen?`Lv.${e[2]} / ${e[10]}`:'出会うと情報が表示されます。'}</p><p>${seen?`討伐 ${seen.defeated||0} / おすすめ：${e[10]}`:''}</p></div>`}).join('');const regions=REGIONS.map(r=>`<div class="card"><h3>${S.codex.regions[r[0]]?'✓':'？'} ${r[7]} ${r[1]}</h3><p>${r[8]}</p></div>`).join('');return`<h3>敵図鑑</h3><div class="grid">${enemies}</div><h3>エリア図鑑</h3><div class="grid">${regions}</div>`}
function achHTML(){return`<p>達成 ${Object.keys(S.ach).length}/${Object.keys(DATA.ach).length}</p><div class="grid">${Object.entries(DATA.ach).map(([id,a])=>`<div class="card"><h3>${S.ach[id]?'🏆':'🔒'} ${a[0]}</h3><p>${S.ach[id]?a[1]:'???'}</p></div>`).join('')}</div>`}
function systemHTML(){return`<div class="grid"><div class="card"><h3>セーブ</h3><p>ブラウザ多重保存＋セーブコード対応。</p><div class="btnrow"><button id="saveBtn">ブラウザ保存</button><button id="exportBtn" class="purple">セーブコード発行</button><button id="importBtn" class="ok">コード読込</button></div></div><div class="card"><h3>名前</h3><input id="rename" class="renameInput" value="${S.player.name}" maxlength="12"><button id="renameBtn">変更</button></div><div class="card"><h3>表示</h3><button id="miniBtn">ミニマップ切替</button><button id="lowFxBtn">軽量FX ${S.settings.lowFx?'ON':'OFF'}</button></div><div class="card"><h3>最初から</h3><button class="danger" id="resetBtn">ニューゲーム</button></div></div>`}
function wireMenu(){document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{const id=b.dataset.use;if(id==='potion')heal(45);else if(id==='megaPotion')heal(110);else if(id==='ether')mp(25);else if(id==='campKit'){heal(140);mp(70)}S.inv[id]--;if(S.inv[id]<=0)delete S.inv[id];renderMenu('items')});document.querySelectorAll('[data-equip]').forEach(b=>b.onclick=()=>{const id=b.dataset.equip,e=DATA.equip[id];S.player.equip[e[1]]=id;log(`${equipName(id)}を装備。`,'good');renderMenu('equip')});document.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>{learn(b.dataset.learn);renderMenu('skills')});document.querySelectorAll('[data-relic]').forEach(b=>b.onclick=()=>{const id=b.dataset.relic,r=DATA.relics[id];rem(r[2]);S.relics[id]=1;ach('codexStarter');log(`レリック解放：${r[0]}`,'rare');save();renderMenu('relics')});document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craft(b.dataset.craft));if($('saveBtn'))$('saveBtn').onclick=save;if($('exportBtn'))$('exportBtn').onclick=exportCode;if($('importBtn'))$('importBtn').onclick=importCode;if($('renameBtn'))$('renameBtn').onclick=()=>{S.player.name=cleanName($('rename').value);save();renderMenu('system')};if($('miniBtn'))$('miniBtn').onclick=()=>{showMini=!showMini;renderMenu('system')};if($('lowFxBtn'))$('lowFxBtn').onclick=()=>{S.settings.lowFx=!S.settings.lowFx;renderMenu('system')};if($('resetBtn'))$('resetBtn').onclick=()=>{if(confirm('本当に最初から？'))newGame()};if($('dailyBoss'))$('dailyBoss').onclick=()=>{closeMenu();const e=cloneEnemy('bossArena');e.name='日替わり強敵 '+e.name;startBattle(e,'dailyBoss')}}
function learn(id,free=false){const s=DATA.skills[id];if(!free){if(S.player.sp<1||S.player.lv<s[2])return;S.player.sp--}S.player.learned[id]=1;log(`${s[0]}を習得。`,'rare')}
function craft(id){const rec={potion:[{herb:3},{items:{potion:2}}],ironSword:[{ore:5,wood:2},{equip:'ironSword'}],ironArmor:[{ore:6,hide:4},{equip:'ironArmor'}],emberBlade:[{ore:7,ember:3,crystal:1},{equip:'emberBlade'}],frostRobe:[{hide:6,frost:3,crystal:1},{equip:'frostRobe'}],auroraBlade:[{ore:12,crystal:7,stardust:3,ancientCoin:1},{equip:'auroraBlade'}],dragonArmor:[{hide:12,ember:4,frost:4,shadow:2},{equip:'dragonArmor'}],voidRing:[{shadow:5,pearl:2,stardust:4},{equip:'voidRing'}]}[id];if(!rec||!has(rec[0]))return;rem(rec[0]);reward(rec[1]);S.stats.crafted++;ach('crafter');save();renderMenu('craft')}
function shop(k){const goods={item:['potion','ether','megaPotion','campKit'],smith:['ironSword','ironArmor','copperRing','auroraBlade'],royal:['megaPotion','ether','frostRobe','moonDagger','braveBadge','dragonArmor','voidRing']}[k]||[];const o=document.createElement('div');o.className='overlay show';o.style.zIndex=65;modalOpen=true;o.innerHTML=`<div class="modal"><h2>ショップ</h2><p>${S.player.gold}G</p><div class="grid">${goods.map(id=>{const it=DATA.items[id]||DATA.equip[id],price=DATA.items[id]?.[3]||DATA.equip[id]?.[5];return`<div class="card"><h3>${it[0]}</h3><p>${DATA.items[id]?.[1]||DATA.equip[id]?.[6]}</p><p>${price}G</p><button data-buy="${id}" ${S.player.gold>=price?'':'disabled'}>買う</button></div>`}).join('')}</div><button id="shopClose" class="ghost">閉じる</button></div>`;document.body.appendChild(o);$('shopClose').onclick=()=>{modalOpen=false;o.remove()};o.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy,price=DATA.items[id]?.[3]||DATA.equip[id]?.[5];if(S.player.gold<price)return;S.player.gold-=price;DATA.items[id]?addItem(id,1):addEquip(id);o.remove();modalOpen=false;shop(k)})}
function ending(){setTimeout(()=>{showMenu('story');const end=document.createElement('div');end.className='card';end.innerHTML='<h3>🌅 エンディング</h3><p>宵闇の王は倒れ、アステリアに朝日が戻った。クリア後は深淵・闘技場・レリック集めへ。</p>';$('menuBody').prepend(end)},700)}
function findPath(sx,sy,gx,gy){if(!can(gx,gy))return null;const key=(x,y)=>x+','+y,open=[{x:sx,y:sy,g:0,f:Math.abs(gx-sx)+Math.abs(gy-sy)}],came={},cost={[key(sx,sy)]:0},dirs=[[1,0],[-1,0],[0,1],[0,-1]];let limit=4500;while(open.length&&limit--){open.sort((a,b)=>a.f-b.f);const n=open.shift();if(n.x===gx&&n.y===gy){const out=[];let k=key(gx,gy);while(k!==key(sx,sy)){const a=k.split(',').map(Number);out.unshift({x:a[0],y:a[1]});k=came[k]}return out}for(const d of dirs){const x=n.x+d[0],y=n.y+d[1];if(!can(x,y))continue;const nk=key(x,y),ng=n.g+1+(map[y][x]===T.MOUNTAIN?.7:0);if(cost[nk]==null||ng<cost[nk]){cost[nk]=ng;came[nk]=key(n.x,n.y);open.push({x,y,g:ng,f:ng+Math.abs(gx-x)+Math.abs(gy-y)})}}}return null}
function autoPath(dt){if(!path.length||inBattle||menuOpen())return;const p=path[0],dx=p.x-S.player.fx,dy=p.y-S.player.fy,d=Math.hypot(dx,dy);if(d<.06){S.player.fx=p.x;S.player.fy=p.y;S.player.x=p.x;S.player.y=p.y;path.shift();if(!path.length)pathTarget=null;return}S.player.fx+=dx/d*dt*5;S.player.fy+=dy/d*dt*5;const ox=S.player.x,oy=S.player.y;S.player.x=Math.round(S.player.fx);S.player.y=Math.round(S.player.fy);if(S.player.x!==ox||S.player.y!==oy){onStep()}}
function handleJoy(dt){if(!joy.on||inBattle||menuOpen())return;if(Math.hypot(joy.x,joy.y)<.1)return;path=[];pathTarget=null;const speed=4.2,nx=S.player.fx+joy.x*speed*dt,ny=S.player.fy+joy.y*speed*dt;if(can(Math.round(nx),Math.round(ny))){S.player.fx=nx;S.player.fy=ny;const ox=S.player.x,oy=S.player.y;S.player.x=Math.round(nx);S.player.y=Math.round(ny);if(S.player.x!==ox||S.player.y!==oy)onStep()}}
function onStep(){S.player.steps++;markRegion();dirty=true;if(S.player.steps%20===0)S.player.energy=cl(S.player.energy+1,0,S.player.maxEnergy);if(ch(.012)&&![T.TOWN,T.ROAD,T.DUNGEON].includes(map[S.player.y][S.player.x]))startBattle(pickEnemy(map[S.player.y][S.player.x]))}
function bindInput(){let lastFire=0,downBtn=null;document.addEventListener('pointerdown',e=>{const b=e.target.closest?.('button');if(!b||b.disabled)return;e.preventDefault();downBtn=b;b.classList.add('pressed')},true);document.addEventListener('pointerup',e=>{const b=downBtn||e.target.closest?.('button');if(!b||b.disabled)return;e.preventDefault();e.stopPropagation();b.classList.remove('pressed');downBtn=null;const n=performance.now();if(n-lastFire<150)return;lastFire=n;b.click()},true);document.addEventListener('click',e=>{if(e.isTrusted&&performance.now()-lastFire<430){e.preventDefault();e.stopImmediatePropagation()}},true);document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));const j=$('joy'),kn=$('joyKnob');j.addEventListener('pointerdown',e=>{e.preventDefault();joy.on=true;joy.id=e.pointerId;j.setPointerCapture(e.pointerId);updJoy(e)});j.addEventListener('pointermove',e=>{if(joy.on&&e.pointerId===joy.id){e.preventDefault();updJoy(e)}});const end=e=>{if(joy.id!==null&&e.pointerId!==joy.id)return;joy={on:false,id:null,x:0,y:0};kn.style.transform='translate(0,0)'};j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end);C.addEventListener('pointerdown',e=>{if(inBattle||menuOpen())return;const r=C.getBoundingClientRect(),x=Math.floor(((e.clientX-r.left)/r.width*W+cam.x)/TILE),y=Math.floor(((e.clientY-r.top)/r.height*H+cam.y)/TILE);if(x<0||y<0||x>=MW||y>=MH)return;if(Math.abs(x-S.player.x)+Math.abs(y-S.player.y)<=1){interact();return}const p=findPath(S.player.x,S.player.y,x,y);if(p){path=p;pathTarget={x,y};toast('自動移動開始')}else toast(can(x,y)?'道が複雑すぎます':'水や壁で進めません')})}
function updJoy(e){const r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,m=r.width*.40;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}const dead=.25;joy.x=Math.abs(dx/m)<dead?0:dx/m;joy.y=Math.abs(dy/m)<dead?0:dy/m;$('joyKnob').style.transform=`translate(${dx}px,${dy}px)`}
function act(a){if(a==='interact')interact();if(a==='menu')showMenu('status');if(a==='quests')showMenu('quests');if(a==='story')showMenu('story');if(a==='map'){showMini=!showMini;toast('ミニマップ '+(showMini?'ON':'OFF'))}if(a==='save')save()}
function newGame(){S=base($('nicknameInput').value);genMap();repair();cam.ready=false;$('titleOverlay').classList.remove('show');$('logPanel').innerHTML='';opening(()=>{log('まずは光る星のかけらを拾おう。','rare')});save()}
function cont(){if(load()){genMap();cam.ready=false;$('titleOverlay').classList.remove('show');log('セーブを読み込みました。','good')}else loadIDB(ok=>{if(ok){genMap();cam.ready=false;$('titleOverlay').classList.remove('show');log('IndexedDBバックアップを読み込みました。','good')}else toast('セーブデータがありません')})}
function opening(done){if(S.flags.openingSeen){done&&done();return}const o=document.createElement('div');o.className='openingOverlay';o.innerHTML=`<div class="openingStars"></div><div class="openingFrame"><div class="openingTitle">星屑のレガリア</div><div class="crawlWindow"><div class="crawlText">星を失った巨大島、アステリア。<br><br>夜空の星は砕け、世界は長い宵闇に包まれた。<br><br>古代装置レガリアだけが、失われた夜明けを呼び戻せる。<br><br>あなたは星のかけらに選ばれた冒険者。<br><br>星のかけら、宝箱、初戦闘、村長、古鉱山へ。<br><br>宵闇城の王を倒し、島に朝を取り戻せ。</div></div><button class="openingSkip" id="skipOpen">冒険を始める</button></div>`;document.body.appendChild(o);$('skipOpen').onclick=()=>{S.flags.openingSeen=true;o.remove();done&&done();save()}}
function how(){showMenu('story')}
function boot(){bindInput();$('newGame').onclick=newGame;$('continueGame').onclick=cont;$('importTitle').onclick=importCode;$('howTo').onclick=how;try{const raw=localStorage.getItem(SAVE_KEY2)||localStorage.getItem(SAVE_KEY);if(raw)$('nicknameInput').value=JSON.parse(raw).player?.name||'こじこじ';else $('continueGame').disabled=true}catch(_){$('continueGame').disabled=true}genMap();S=base();repair();updateUI();draw()}
boot();
})();
</script>
</body>
</html>
