<body>
<div id="wrap">
  <canvas id="game" width="960" height="540" aria-label="星屑のレガリア ゲーム画面"></canvas>
  <div class="ui">
    <div class="topbar"><div class="panel stat" id="statPanel"></div><div class="panel side" id="sidePanel"></div></div>
    <div class="panel questbox" id="questPanel"></div>
    <div class="objective" id="objective"><div class="label">NEXT OBJECTIVE</div><div class="goal">星のかけらを拾おう</div><div class="sub">光の矢印を追えば迷いません</div></div>

    <div class="panel log" id="logPanel"></div>

      <div class="joy" id="joy"><div class="joyBase"></div><div class="joyRing"></div><div class="joyKnob" id="joyKnob"></div></div>
      <div class="quick">
        <button class="main" data-act="interact">調べる / 採集</button>
        <button data-act="menu">メニュー</button><button data-act="quests">クエスト</button>
        <button data-act="story">目的</button><button data-act="map">地図</button>
        <button class="save" data-act="save">セーブ</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <div class="cutin" id="cutin"></div>
  <div class="finishBanner" id="finishBanner"></div>
  <div class="overlay show" id="titleOverlay">
    <div class="modal" style="text-align:center;max-width:780px">
      <div class="title">星屑のレガリア</div>
      <div class="subtitle">V21 Destruction 完全版：探索・戦闘・物語・保存を全部入りにした2D探索RPG</div>

    </div>
  </div>
  <div class="overlay" id="menuOverlay"><div class="modal" id="menuContent"></div></div>

    <h2 id="battleTitle">戦闘</h2>

    <div class="battleHud"><div class="card" id="battleHero"></div><div class="card" id="battleEnemy"></div></div>
    <div class="enemyTip" id="enemyTip"></div>
    <div class="btnrow battleBtns" id="battleBtns"></div>
  </div></div>
</div>

function startBattle(enemy,placeId=null){
  inBattle=true;
  battle={enemy,placeId,turn:'player',def:false,motion:{hero:null,enemy:null},flash:0,destruction:{level:0,cracks:[],debris:[],dust:0}};
  S.codex.enemies[enemy.id]=S.codex.enemies[enemy.id]||{seen:1,defeated:0};
  if(S.relics.comet)S.player.energy=cl(S.player.energy+20,0,S.player.maxEnergy);
  $('battleOverlay').classList.add('show');
  hideFinishBanner();
  playBattleBgm(enemy);
  if(enemy.boss)showBossCutin(enemy,'encounter');
  else showCutin(`${enemy.emoji} ${enemy.name}`,'normal','BATTLE START');
  log(`${enemy.name}が現れた！`,'bad');
  renderBattle();
}
function showCutin(title,tone='normal',sub=''){
  const c=$('cutin');
  const style={
    normal:['linear-gradient(90deg,#08030f,#7b162c,#08030f)','var(--gold)','#fff4bf'],
    hero:['linear-gradient(90deg,#071428,#254fc4,#071428)','#9dd7ff','#eef8ff'],
    boss:['linear-gradient(90deg,#16040d,#7d132e,#16040d)','#ffe38f','#fff0c9'],
    abyss:['linear-gradient(90deg,#090311,#3a1465,#090311)','#d6a6ff','#f1e2ff'],
    dragon:['linear-gradient(90deg,#07121a,#1a5ea8,#07121a)','#9de8ff','#eefcff']
  }[tone]||['linear-gradient(90deg,#08030f,#7b162c,#08030f)','var(--gold)','#fff4bf'];
  c.style.background=style[0];
  c.style.borderColor=style[1];
  c.style.boxShadow=`0 0 48px #000, 0 0 24px ${style[1]}55`;
  c.innerHTML=`<div style="font-size:${sub?30:26}px;font-weight:1000;letter-spacing:.09em;color:${style[1]};text-shadow:0 0 12px #000,0 0 18px ${style[1]}66">${title}</div>${sub?`<div style="margin-top:4px;font-size:13px;letter-spacing:.28em;color:${style[2]}">${sub}</div>`:''}`;
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show');
  clearTimeout(showCutin.t);showCutin.t=setTimeout(()=>c.classList.remove('show'),sub?1500:1100);
}

}[id]||{threshold:.45,name2:'第2形態',tip2:'第2形態',maxMul:.72,atkMul:1.25,defMul:1.1,fx:'bossFinisher',banner:'PHASE SHIFT',sub:'PHASE 2',tone:'boss',aura:'#ffe38f'}}
function bossBackdropData(enemy){if(!enemy?.boss)return null;const phase2=!!enemy.phase2;const map={

function addBackgroundDestruction(enemy,intensity=1,reason='impact'){
  if(!battle)return;
  battle.destruction ||= {level:0,cracks:[],debris:[],dust:0};
  const d=battle.destruction;
  d.level=cl((d.level||0)+intensity,0,7);
  d.dust=Math.max(d.dust||0,.55+intensity*.16);
  const col=crackColorFor(enemy);
  const count=Math.floor(3+intensity*4);
  for(let i=0;i<count;i++){
    const sx=rand(30,860), sy=rand(28,150), len=rand(22,72)+intensity*10, branches=rand(2,5);
    d.cracks.push({x:sx,y:sy,len,ang:Math.random()*Math.PI*2,life:420+rand(0,260),col,branches,phase:enemy?.phase||1});
  }
  for(let i=0;i<count*3;i++){
    d.debris.push({x:rand(0,900),y:rand(60,150),vx:(Math.random()-.5)*(2+intensity),vy:Math.random()*(2.8+intensity)+.8,rot:Math.random()*6,vr:(Math.random()-.5)*.12,size:rand(3,10)+intensity*1.5,life:120+rand(0,90),col});
  }
  if(reason==='phase')finishBanner('BREAKING FIELD','背景が崩壊して戦場が変化！','boss');
}
function drawBackgroundDestruction(enemy,layer='back'){
  if(!battle?.destruction)return;
  const d=battle.destruction;
  const theme=bossBackdropData(enemy);
  if(layer==='back'){
    if(d.dust>0){
      BX.fillStyle=(theme?.glow||'#ffe38f')+Math.floor(18+d.dust*28).toString(16).padStart(2,'0');
      for(let i=0;i<6+d.level*2;i++){
        BX.beginPath();
        BX.ellipse((i*151+t*22)%940,132+Math.sin(t*1.6+i)*18,90+d.level*10,15+d.level*3,0,0,Math.PI*2);
        BX.fill();
      }
      d.dust=Math.max(0,d.dust-.012);
    }
    BX.save();
    BX.lineCap='round';
    for(const c of d.cracks){
      const fade=cl(c.life/620,0,1);
      BX.globalAlpha=.22+.58*fade;
      BX.strokeStyle=c.col;
      BX.lineWidth=1.2+(c.phase===2?1.1:0);
      BX.beginPath();
      BX.moveTo(c.x,c.y);
      let x=c.x,y=c.y,a=c.ang;
      for(let j=0;j<c.branches;j++){
        x+=Math.cos(a)*(c.len/c.branches)*(0.7+Math.random()*.35);
        y+=Math.sin(a)*(c.len/c.branches)*(0.7+Math.random()*.35);
        BX.lineTo(x,y);
        a+=(Math.random()-.5)*.9;
      }
      BX.stroke();
      for(let b=0;b<2;b++){
        BX.beginPath();
        const bx=c.x+Math.cos(c.ang)*(c.len*(.25+b*.22));
        const by=c.y+Math.sin(c.ang)*(c.len*(.25+b*.22));
        BX.moveTo(bx,by);
        BX.lineTo(bx+Math.cos(c.ang+(b?1:-1)*.9)*c.len*.28,by+Math.sin(c.ang+(b?1:-1)*.9)*c.len*.28);
        BX.stroke();
      }
      c.life--;
    }
    d.cracks=d.cracks.filter(c=>c.life>0);
    BX.restore();
  }else{
    BX.save();
    for(const q of d.debris){
      BX.globalAlpha=cl(q.life/160,0,1);
      BX.fillStyle=q.col;
      BX.translate(q.x,q.y);
      BX.rotate(q.rot);
      BX.fillRect(-q.size/2,-q.size/2,q.size,q.size*.65);
      BX.setTransform(1,0,0,1,0,0);
      q.x+=q.vx;
      q.y+=q.vy;
      q.vy+=.045;
      q.rot+=q.vr;
      q.life--;
    }
    d.debris=d.debris.filter(q=>q.life>0&&q.y<270);
    BX.restore();
    BX.globalAlpha=1;
    if(d.level>3){
      BX.save();
      BX.strokeStyle=(theme?.glow||'#ffe38f')+'55';
      BX.lineWidth=2;
      for(let i=0;i<Math.min(8,d.level*2);i++){
        const x=(i*113+t*35)%900;
        BX.beginPath();
        BX.moveTo(x,156);
        BX.lineTo(x+rand(-20,20),246);
        BX.stroke();
      }
      BX.restore();
    }
  }

function updJoy(e){const r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,m=r.width*.40;let dx=e.clientX-cx,dy=e.clientY-cy,l=Math.hypot(dx,dy);if(l>m){dx=dx/l*m;dy=dy/l*m}const dead=.25;joy.x=Math.abs(dx/m)<dead?0:dx/m;joy.y=Math.abs(dy/m)<dead?0:dy/m;$('joyKnob').style.transform=`translate(${dx}px,${dy}px)`}
function act(a){if(a==='interact')interact();if(a==='menu')showMenu('status');if(a==='quests')showMenu('quests');if(a==='story')showMenu('story');if(a==='map'){showMini=!showMini;toast('ミニマップ '+(showMini?'ON':'OFF'))}if(a==='save')save()}
function newGame(){unlockAudio();S=base($('nicknameInput').value);genMap();repair();cam.ready=false;$('titleOverlay').classList.remove('show');$('logPanel').innerHTML='';playFieldBgm();opening(()=>{log('まずは光る星のかけらを拾おう。','rare')});save()}
function cont(){unlockAudio();if(load()){genMap();cam.ready=false;$('titleOverlay').classList.remove('show');playFieldBgm();log('セーブを読み込みました。','good')}else loadIDB(ok=>{if(ok){genMap();cam.ready=false;$('titleOverlay').classList.remove('show');playFieldBgm();log('IndexedDBバックアップを読み込みました。','good')}else toast('セーブデータがありません')})}
function opening(done){if(S.flags.openingSeen){done&&done();return}const o=document.createElement('div');o.className='openingOverlay';o.innerHTML=`<div class="openingStars"></div><div class="openingFrame"><div class="openingTitle">星屑のレガリア</div><div class="crawlWindow"><div class="crawlText">星を失った巨大島、アステリア。<br><br>夜空の星は砕け、世界は長い宵闇に包まれた。<br><br>古代装置レガリアだけが、失われた夜明けを呼び戻せる。<br><br>あなたは星のかけらに選ばれた冒険者。<br><br>星のかけら、宝箱、初戦闘、村長、古鉱山へ。<br><br>宵闇城の王を倒し、島に朝を取り戻せ。</div></div><button class="openingSkip" id="skipOpen">冒険を始める</button></div>`;document.body.appendChild(o);$('skipOpen').onclick=()=>{S.flags.openingSeen=true;o.remove();done&&done();save()}}
function how(){showMenu('story')}
function boot(){bindInput();$('newGame').onclick=newGame;$('continueGame').onclick=cont;$('importTitle').onclick=importCode;$('howTo').onclick=how;try{const raw=localStorage.getItem(SAVE_KEY2)||localStorage.getItem(SAVE_KEY);if(raw)$('nicknameInput').value=JSON.parse(raw).player?.name||'こじこじ';else $('continueGame').disabled=true}catch(_){$('continueGame').disabled=true}genMap();S=base();repair();updateUI();draw()}
boot();
})();
</script>
</body>
