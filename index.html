function drawBattleFx(){fx=fx.filter(f=>{f.life++;const u=f.life/f.max;BX.save();BX.globalAlpha=1-u;BX.translate(f.x,f.y);if(f.side==='hero')BX.scale(-1,1);const col={nova:'#ffe38f',meteor:'#ffb57d',slash:'#f8fbff',smash:'#ffb36a',fire:'#ff9b55',ice:'#9de2ff',thunder:'#fff56d',dark:'#c8a4ff',star:'#ffe38f',guard:'#9fe0ff',heal:'#7ff2a6',focus:'#d8f0ff',finisher:'#ffe38f',bossFinisher:'#ffb06a'}[f.type]||'#fff';BX.strokeStyle=col;BX.fillStyle=col;BX.shadowColor=col;BX.shadowBlur=(f.type==='star'||f.type==='nova'||f.type==='meteor')?30:20;if(['slash','finisher','bossFinisher'].includes(f.type)){const n=f.type==='bossFinisher'?10:4;for(let i=0;i<n;i++){BX.lineWidth=4;BX.beginPath();BX.moveTo(-44+i*6,-20+i*7);BX.quadraticCurveTo(0,-34+u*12,48+i*3,26+i*8);BX.stroke()}}else if(f.type==='smash'){BX.lineWidth=6;BX.beginPath();BX.arc(0,16,18+u*44,Math.PI,Math.PI*2);BX.stroke();for(let i=0;i<10;i++)BX.fillRect(-36+i*8+Math.sin(i+u*10)*4,-4-u*18*(i%2),5,5)}else if(f.type==='fire'){for(let i=0;i<14;i++){const a=i*Math.PI*2/14+u*2.2,r=18+u*34+(i%3)*4;BX.beginPath();BX.ellipse(Math.cos(a)*r,Math.sin(a)*r*.55,7,14,a,0,Math.PI*2);BX.fill()}}else if(f.type==='ice'){BX.lineWidth=3;for(let i=0;i<7;i++){const a=i*Math.PI*2/7;BX.beginPath();BX.moveTo(0,0);BX.lineTo(Math.cos(a)*(18+u*48),Math.sin(a)*(18+u*48));BX.stroke()}}else if(f.type==='thunder'){BX.lineWidth=6;BX.beginPath();BX.moveTo(-26,-54);BX.lineTo(-6,-18);BX.lineTo(-20,-18);BX.lineTo(8,22);BX.lineTo(-2,22);BX.lineTo(20,56);BX.stroke()}else if(f.type==='dark'){for(let i=0;i<4;i++){BX.beginPath();BX.arc(0,0,16+i*12+u*10,i*1.1+u*2.5,i*1.1+u*2.5+1.5);BX.stroke()}}else if(f.type==='nova'||f.type==='star'){for(let i=0;i<26;i++){const a=i*Math.PI*2/26+t*2.4,r=18+u*100+(i%3)*5;BX.beginPath();BX.arc(Math.cos(a)*r,Math.sin(a)*r*.74,4.3,0,Math.PI*2);BX.fill()}BX.lineWidth=6;BX.beginPath();BX.arc(0,0,24+u*86,0,Math.PI*2);BX.stroke()}else if(f.type==='meteor'){for(let i=0;i<6;i++){BX.save();BX.rotate(-.45+i*.12);BX.fillRect(-60+u*90+i*8,-68+i*10,54,5);BX.restore()}BX.lineWidth=5;BX.beginPath();BX.arc(0,0,26+u*64,0,Math.PI*2);BX.stroke()}else if(f.type==='guard'){BX.lineWidth=3;BX.beginPath();BX.moveTo(-22,-16);BX.lineTo(-30,8);BX.lineTo(-22,34);BX.lineTo(4,28);BX.lineTo(14,8);BX.lineTo(4,-12);BX.closePath();BX.stroke();BX.fillStyle='rgba(120,205,255,.15)';BX.fill()}else if(f.type==='heal'||f.type==='focus'){for(let i=0;i<12;i++){const a=i*Math.PI*2/12;BX.beginPath();BX.arc(Math.cos(a)*(14+u*20),-u*32+Math.sin(a)*10,3,0,Math.PI*2);BX.fill()}BX.lineWidth=4;BX.beginPath();BX.moveTo(-10,0);BX.lineTo(10,0);BX.moveTo(0,-10);BX.lineTo(0,10);BX.stroke()}BX.shadowBlur=0;BX.font='bold '+(f.crit?28:24)+'px system-ui';BX.textAlign='center';BX.fillStyle=f.crit?'#fff6b4':'#ffffff';if(f.dmg)BX.fillText((f.crit?'CRIT ':'')+Math.floor(f.dmg),0,-52-u*18);BX.restore();return f.life<f.max})}
function completionRates(){const explore=Math.floor(Object.keys(S.seen).length/(MW*MH)*100),chest=Math.floor((S.stats.opened||0)/CHESTS.length*100),enemySeen=Object.keys(S.codex.enemies||{}).length,regionSeen=Object.keys(S.codex.regions||{}).length,codex=Math.floor((enemySeen+regionSeen)/(Object.keys(DATA.enemies).length+REGIONS.length)*100),achr=Math.floor(Object.keys(S.ach||{}).length/Object.keys(DATA.ach).length*100);return {explore,chest,codex,ach:achr,enemySeen,regionSeen}}function showMenu(tab='status'){$('menuOverlay').classList.add('show');renderMenu(tab)}function closeMenu(){$('menuOverlay').classList.remove('show')}
function renderMenu(tab){const tabs=[['status','ステータス'],['story','目的'],['daily','デイリー'],['items','アイテム'],['equip','装備'],['skills','スキル'],['craft','クラフト'],['relics','レリック'],['quests','クエスト'],['codex','図鑑'],['ach','実績'],['system','システム']];$('menuContent').innerHTML=`<h2>メニュー</h2><div class="tabs">${tabs.map(([id,n])=>`<button class="tab ${id===tab?'active':''}" data-tab="${id}">${n}</button>`).join('')}<button id="closeMenu" class="danger">閉じる</button></div><div id="menuBody"></div>`;$('closeMenu').onclick=closeMenu;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>renderMenu(b.dataset.tab));const body=$('menuBody');body.innerHTML=({status:statusHTML,story:storyHTML,daily:dailyHTML,items:itemsHTML,equip:equipHTML,skills:skillsHTML,craft:craftHTML,relics:relicHTML,quests:questsHTML,codex:codexHTML,ach:achHTML,system:systemHTML}[tab]||statusHTML)();wireMenu()}
function statusHTML(){const p=S.player,r=completionRates();return`<div class="grid"><div class="card"><h3>${p.name}</h3><p>Lv.${p.lv} / ${p.gold}G / SP ${p.sp}</p><p>HP ${p.hp}/${stat('maxHp')} / MP ${p.mp}/${stat('maxMp')}</p><p>ATK ${stat('atk')} / MATK ${stat('matk')} / DEF ${stat('def')}</p><p>歩数 ${p.steps} / 撃破 ${S.stats.kills} / 宝箱 ${S.stats.opened}</p></div><div class="card"><h3>やり込みカード</h3><p>探索率 ${r.explore}%</p><p>宝箱回収率 ${r.chest}%（${S.stats.opened}/${CHESTS.length}）</p><p>図鑑達成率 ${r.codex}%</p><p>実績達成率 ${r.ach}%</p></div><div class="card"><h3>装備中</h3>${Object.entries(p.equip).map(([s,id])=>`<p>${slotName(s)}：${id?equipName(id):'なし'}</p>`).join('')}</div></div>`}function storyHTML(){const route=['星のかけらを拾う','宝箱を開ける','初戦闘を突破する','村長リオへ報告','古鉱山を攻略','星見塔でレガリア入手','レガリア修復','宵闇城で最終決戦','クリア後：深淵・闘技場・レリック'];return`<div class="grid"><div class="card"><h3>今やること</h3><p class="spark">${mainGoal()}</p><p>光の矢印、足元の光、ミニマップの黄色マーカーを追うと迷いません。</p></div><div class="card"><h3>物語の流れ</h3>${route.map((r,i)=>`<p>${i<storyIndex()?'✓':i===storyIndex()?'▶':'・'} ${r}</p>`).join('')}</div><div class="card"><h3>最終目標</h3><p>宵闇城で宵闇の王を倒し、アステリアに夜明けを取り戻す。</p></div></div>`}function storyIndex(){if(!S.tutorial.star)return 0;if(!S.flags.chests.t0)return 1;if(!S.tutorial.battle)return 2;if(!S.quests.q1.done)return 3;if(!placeCleared('mine'))return 4;if(!placeCleared('tower'))return 5;if(!S.quests.q4.done)return 6;if(!placeCleared('castle'))return 7;return 8}function dailyHTML(){return`<div class="grid"><div class="card"><h3>今日のボーナス</h3><p><span class="badge">${S.daily.boost}</span><span class="badge">連続${S.daily.streak}日</span></p><p>村の近くにデイリー宝箱：${S.daily.chest?'開封済み':'未開封'}</p></div><div class="card"><h3>日替わりボス</h3><p>1日1回、報酬多めの強敵に挑戦。</p><button id="dailyBoss" ${S.daily.boss?'disabled':''}>挑戦する</button></div></div>`}
function itemsHTML(){const rows=Object.entries(S.inv).map(([id,n])=>`<tr><td>${itemName(id)}</td><td>${n}</td><td>${DATA.items[id]?.[1]||''}</td><td>${DATA.items[id]?.[2]==='use'?`<button data-use="${id}">使う</button>`:''}</td></tr>`).join('');return rows?`<table><tr><th>名前</th><th>数</th><th>説明</th><th></th></tr>${rows}</table>`:'<p>アイテムなし</p>'}function equipHTML(){let rows='';for(const id of Object.keys(S.equips)){const e=DATA.equip[id];if(!e)continue;const kind=e[1]==='weapon'?`<br><span class="badge">種類：${weaponKindName(weaponKind(id))}</span>`:'';rows+=`<tr><td>${equipName(id)} x${S.equips[id]}<br><span class="badge">${equipRarity(id)}</span>${kind}</td><td>${slotName(e[1])}</td><td>ATK ${e[2]} / MATK ${e[3]} / DEF ${e[4]}</td><td>${e[6]}<br><span class="spark">${affixText(id)}</span></td><td><button data-equip="${id}">装備</button></td></tr>`}return`<table><tr><th>装備</th><th>部位</th><th>性能</th><th>説明</th><th></th></tr>${rows}</table>`}
function skillsHTML(){return`<div class="card"><h3>スキルの手に入れ方</h3><p>レベルアップでSPを入手 → この画面でSP1を使って習得。さらに一部の奥義系スキルはクエストやボス攻略で解放されます。</p><p>戦闘中はMPだけでなく、行動EPも必要です。防御するとEPを回復できます。</p></div><div class="grid">${Object.entries(DATA.skills).map(([id,s])=>{const learned=S.player.learned[id],can=S.player.lv>=s[2]&&S.player.sp>0&&!learned,ep=skillCost(id);return`<div class="card"><h3>${learned?'✓ ':''}${s[0]}</h3><p>${s[4]}</p><p>必要Lv ${s[2]} / MP ${s[1]} / 戦闘EP ${ep}</p><button data-learn="${id}" ${can?'':'disabled'}>${learned?'習得済み':'SP1で習得'}</button></div>`}).join('')}</div>`}
function craftHTML(){const rec={potion:['ポーションx2',{herb:3},{items:{potion:2}}],ironSword:['星鉄の剣',{ore:5,wood:2},{equip:'ironSword'}],greatAxe:['巨神の戦斧',{ore:8,wood:3,crystal:1},{equip:'greatAxe'}],starSpear:['星槍ルミナス',{ore:7,wood:3,crystal:2},{equip:'starSpear'}],moonBow:['月光の弓',{wood:8,crystal:2,pearl:1},{equip:'moonBow'}],twinBlades:['双星の短剣',{ore:8,shadow:1,crystal:1},{equip:'twinBlades'}],arcaneCannon:['魔導星砲',{ore:10,crystal:5,stardust:2},{equip:'arcaneCannon'}],royalKatana:['王家の太刀',{ore:12,shadow:2,stardust:2},{equip:'royalKatana'}],gaiaHammer:['大地のハンマー',{ore:10,crystal:2,hide:4},{equip:'gaiaHammer'}],ironArmor:['星鉄の鎧',{ore:6,hide:4},{equip:'ironArmor'}],emberBlade:['紅蓮の刃',{ore:7,ember:3,crystal:1},{equip:'emberBlade'}],frostRobe:['氷霜のローブ',{hide:6,frost:3,crystal:1},{equip:'frostRobe'}],auroraBlade:['オーロラブレード',{ore:12,crystal:7,stardust:3,ancientCoin:1},{equip:'auroraBlade'}],dragonArmor:['竜鱗の鎧',{hide:12,ember:4,frost:4,shadow:2},{equip:'dragonArmor'}],voidRing:['虚空の指輪',{shadow:5,pearl:2,stardust:4},{equip:'voidRing'}]};return`<div class="card"><h3>武器クラフト大幅追加</h3><p>剣・斧・槍・弓・双剣・魔導砲・太刀・ハンマーを作れるようになりました。武器の種類で奥義が変わります。</p></div><div class="grid">${Object.entries(rec).map(([id,r])=>`<div class="card"><h3>${r[0]}</h3><p>材料：${progressText(r[1])}</p><button data-craft="${id}" ${has(r[1])?'':'disabled'}>作る</button></div>`).join('')}</div>`}

function setDirFromVec(dx,dy){
  if(!S||!S.player)return;
  if(Math.abs(dx)>Math.abs(dy))S.player.dir=dx<0?'left':'right';
  else if(Math.abs(dy)>0.01)S.player.dir=dy<0?'up':'down';
}
function autoPath(dt){
  if(inBattle||menuOpen())return;
  if(!path.length){
    if(pathTarget?.interact){pathTarget=null;setTimeout(()=>{if(!inBattle&&!menuOpen())interact()},40)}
    return;
  }
  const p=path[0],dx=p.x-S.player.fx,dy=p.y-S.player.fy,d=Math.hypot(dx,dy);
  setDirFromVec(dx,dy);
  if(d<.06){
    S.player.fx=p.x;S.player.fy=p.y;S.player.x=p.x;S.player.y=p.y;path.shift();
    if(!path.length&&pathTarget?.interact){pathTarget=null;setTimeout(()=>{if(!inBattle&&!menuOpen())interact()},40)}
    else if(!path.length)pathTarget=null;
    return;
  }
  S.player.fx+=dx/d*dt*5.4;S.player.fy+=dy/d*dt*5.4;
  const ox=S.player.x,oy=S.player.y;S.player.x=Math.round(S.player.fx);S.player.y=Math.round(S.player.fy);
  if(S.player.x!==ox||S.player.y!==oy)onStep();
}
function moveVec(dx,dy,dt){
  setDirFromVec(dx,dy);
  const speed=4.2,nx=S.player.fx+dx*speed*dt,ny=S.player.fy+dy*speed*dt;
  const tx=Math.round(nx),ty=Math.round(ny);
  if(can(tx,ty)){
    S.player.fx=nx;S.player.fy=ny;
    const ox=S.player.x,oy=S.player.y;S.player.x=tx;S.player.y=ty;
    if(S.player.x!==ox||S.player.y!==oy)onStep();
  }
}

  const total=pool.reduce((a,m)=>a+(m.weight||1),0);let r=Math.random()*total;
  for(const m of pool){r-=m.weight||1;if(r<=0)return m}
  return pool[0]||{name:'攻撃',type:'slash',ep:1,power:1,weight:1};
}
function enemyAttackType(e){const m=battle?.pendingEnemyMove; if(m?.type)return m.type; const id=e?.id||''; if(/ice|snow|Yeti/i.test(id))return 'ice'; if(/fire|lava|magma|Phoenix|salamander|Djinn/i.test(id))return 'fire'; if(/thunder|Hawk|Drone|Tower/i.test(id))return 'thunder'; if(/shade|Witch|Stalker|Abyss|Final|curse/i.test(id))return 'dark'; if(/golem|Yeti|Worm|Armor|Scorpion|Scarab/i.test(id))return 'smash'; if(/Bee|Bat|Archer|Rabbit/i.test(id))return 'pierce'; return 'slash'}
function enemySpecialName(e){const m=battle?.pendingEnemyMove;if(m?.name)return m.name;const p=enemyMovePool(e).filter(x=>x.charge).sort((a,b)=>b.power-a.power)[0];return p?.name||'大技'}
function enemyWeaknessText(e){const id=e?.id||''; if(/fire|lava|magma|Phoenix|salamander|Djinn/i.test(id))return '弱点：氷・水系'; if(/ice|snow|Yeti|frost/i.test(id))return '弱点：炎'; if(/golem|Armor|Knight|Scarab|Scorpion/i.test(id))return '弱点：魔法・雷・打撃'; if(/shade|Witch|Stalker|Abyss|Final|curse/i.test(id))return '弱点：光・星属性・奥義'; if(/Bee|Moth|Bat|Hawk|Archer/i.test(id))return '弱点：弓・雷・風'; if(/slime/i.test(id))return '弱点：斬撃・炎'; return '弱点：状況に合わせたスキル'}
function enemyRecommendText(e){if(e.warn)return `おすすめ：防御。次は「${enemySpecialName(e)}」`; if(S.player.hp/stat('maxHp')<.35)return 'おすすめ：回復アイテム'; if(battle?.heroEP<=0)return 'おすすめ：防御してEP回復'; if(S.player.energy>=S.player.maxEnergy)return 'おすすめ：武器奥義'; return `${enemyWeaknessText(e)} / EPを残して戦おう`}
function applyEnemyMoveEffect(move,dmg){
  if(!battle||!move)return;
  const e=battle.enemy;
  if(move.effect==='stealEP'){battle.heroEP=cl((battle.heroEP||0)-1,0,energyMax());log('行動EPを1削られた！','bad')}
  if(move.effect==='breakGuard'){battle.def=false;S.player.guard=0;log('防御を崩された！','bad')}
  if(move.effect==='poison'){const pd=Math.max(3,Math.floor(e.atk*.18));S.player.hp-=pd;log(`追加の毒ダメージ ${pd}`,'bad')}
  if(move.effect==='burn'){const bd=Math.max(4,Math.floor(e.atk*.22));S.player.hp-=bd;log(`追加の炎ダメージ ${bd}`,'bad')}
  if(move.effect==='healSelf'){const hv=Math.max(24,Math.floor(e.maxHp*.12));e.hp=cl(e.hp+hv,1,e.maxHp);battleFx('enemy','heal',0,false);log(`${e.name}は${hv}回復した。`,'bad')}
  if(move.effect==='shield'){e.def+=2;battleFx('enemy','guard',0,false);log(`${e.name}の防御が上がった。`,'bad')}
  if(move.effect==='charge'){battle.enemyEP=cl((battle.enemyEP||0)+2,0,6);battleFx('enemy','focus',0,false);log(`${e.name}は力を集中した。`,'bad')}
}
function enemyTurn(){
  if(!inBattle||!battle||battle.finishing||battle.phaseChanging||battle.turn!=='enemy')return;
  const e=battle.enemy,p=S.player;ensureBattleEnergy();
  if(e.warn){
    const move=battle.pendingEnemyMove||chooseEnemyMove(e,true);e.warn=false;battle.pendingEnemyMove=null;
    showCutin(move.name,e.boss?'boss':'normal','SPECIAL ATTACK');battle.flash=Math.max(battle.flash,.55);battle.enemyEP=cl((battle.enemyEP||0)-move.ep,0,6);
    let dmg=Math.floor(e.atk*move.power-stat('def')*.35);if(battle.def)dmg=Math.floor(dmg*.45);if(p.guard)dmg=Math.floor(dmg*.55);if(e.boss)addBackgroundDestruction(e,e.phase2?2.2:1.4);
    hitPlayer(Math.max(1,dmg),move.name,move.type,true);applyEnemyMoveEffect(move,dmg);if(S.player.hp<=0){loseBattle();return}return;
  }
  const charged=chooseEnemyMove(e,true);
  if(charged.charge && (battle.enemyEP||0)>=charged.ep && ch(e.boss?(e.phase2?.68:.48):.36)){
    battle.pendingEnemyMove=charged;e.warn=true;log(`${e.name}が「${charged.name}」の構えに入った。防御しよう！`,'bad');showCutin('⚠ 大技準備',e.boss?'boss':'normal','DEFEND NOW');battle.turn='player';gainEP(1);renderBattle();return;
  }
  const move=chooseEnemyMove(e,false);battle.enemyEP=cl((battle.enemyEP||0)-move.ep,0,6);
  if(['healSelf','shield','charge'].includes(move.effect)&&move.power===0){applyEnemyMoveEffect(move,0);battle.turn='player';gainEP(1);renderBattle();return}
  let dmg=Math.max(1,Math.floor(e.atk*move.power*rand(88,116)/100-stat('def')*.38));
  if(battle.def){dmg=Math.floor(dmg*.5);battle.def=false}if(p.guard){dmg=Math.floor(dmg*.6);p.guard--}
  hitPlayer(dmg,move.name,move.type,false);applyEnemyMoveEffect(move,dmg);if(S.player.hp<=0){loseBattle();return}
}
function pickEnemy(tile){
  let list=Object.keys(DATA.enemies).filter(id=>!DATA.enemies[id][11]&&DATA.enemies[id][9].includes(tile));
  if(!list.length)list=['slime','wolf'];
  const lv=S?.player?.lv||1;
  list=list.filter(id=>DATA.enemies[id][2]<=lv+5 || ch(.18));
  if(!list.length)list=['slime','hornRabbit','wolf'];
  if(ch(.025))return cloneEnemy('mimic');
  return cloneEnemy(list[rand(0,list.length-1)]);
}
function v28IntegrityCheck(){
  const problems=[];
  const inside=(name,x,y)=>{if(!(x>=0&&y>=0&&x<MW&&y<MH))problems.push(`${name} 座標外 ${x},${y}`)};
  for(const n of NPCS)inside('NPC '+n[1],n[2],n[3]);
  for(const c of CHESTS)inside('宝箱 '+c[1],c[2],c[3]);
  for(const p of PLACES)inside('入口 '+p[1],p[2],p[3]);
  for(const [id,e] of Object.entries(DATA.enemies)){if(!Array.isArray(e)||e.length<11)problems.push(`敵データ不完全 ${id}`)}
  if(problems.length){console.warn('V28 integrity warnings',problems);log('一部データを安全補正しました。','bad')}else{console.log('V28 integrity check passed: map objects and enemy data OK')}
}
