<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = true;
const W = canvas.width, H = canvas.height;
const TILE = 32;
const MAP_W = 220, MAP_H = 170;
const VERSION = 'V15 STORY & SAVE COMPLETE';
const SAVE_CODE_PREFIX = 'SR-V15:';
const SAVE_KEY = 'stardust_regalia_save_v1';

const $ = id => document.getElementById(id);

const INPUT_LOCK = {downButton:null, downPointer:null, lastSyntheticClick:0, touchFallback:false};
function buttonFromEvent(e){return e?.target?.closest?.('button');}
function clearPressedButton(btn){if(btn)btn.classList.remove('inputPressed');}
function canFireButton(btn){return !!btn && !btn.disabled && btn.isConnected;}
function fireReliableButton(btn){
  if(!canFireButton(btn))return;
  const now=performance.now();
  const last=Number(btn.dataset.lastFire||0);
  if(now-last<130)return;
  btn.dataset.lastFire=String(now);
  btn.classList.add('inputPressed');
  setTimeout(()=>clearPressedButton(btn),130);
  INPUT_LOCK.lastSyntheticClick=now;
  requestAnimationFrame(()=>{
    if(!canFireButton(btn))return;
    if(typeof btn.__tapAction === 'function'){
      try{btn.__tapAction();}catch(err){console.error(err); toast('ボタン処理でエラーが出ました');}
    }else{
      btn.click();
    }
  });
}
function installReliableButtons(){
  if(installReliableButtons.done)return; installReliableButtons.done=true;
  const down=(e)=>{
    const btn=buttonFromEvent(e); if(!btn)return;
    if(btn.disabled)return;
    e.preventDefault(); e.stopPropagation();
    INPUT_LOCK.downButton=btn; INPUT_LOCK.downPointer=e.pointerId;
    btn.classList.add('inputPressed');
    try{btn.setPointerCapture?.(e.pointerId)}catch(_){}
  };
  const up=(e)=>{
    const btn=INPUT_LOCK.downButton || buttonFromEvent(e); if(!btn)return;
    if(INPUT_LOCK.downPointer!==null && e.pointerId!==undefined && e.pointerId!==INPUT_LOCK.downPointer)return;
    e.preventDefault(); e.stopPropagation();
    clearPressedButton(btn);
    INPUT_LOCK.downButton=null; INPUT_LOCK.downPointer=null;
    fireReliableButton(btn);
  };
  const cancel=(e)=>{clearPressedButton(INPUT_LOCK.downButton);INPUT_LOCK.downButton=null;INPUT_LOCK.downPointer=null;};
  document.addEventListener('pointerdown',down,true);
  document.addEventListener('pointerup',up,true);
  document.addEventListener('pointercancel',cancel,true);
  document.addEventListener('lostpointercapture',cancel,true);
  document.addEventListener('click',e=>{
    const btn=buttonFromEvent(e); if(!btn)return;
    if(e.isTrusted && performance.now()-INPUT_LOCK.lastSyntheticClick<420){
      e.preventDefault(); e.stopImmediatePropagation();
    }
  },true);
  if(!window.PointerEvent){
    INPUT_LOCK.touchFallback=true;
    document.addEventListener('touchstart',e=>{const btn=buttonFromEvent(e);if(!btn||btn.disabled)return;e.preventDefault();INPUT_LOCK.downButton=btn;btn.classList.add('inputPressed');},{capture:true,passive:false});
    document.addEventListener('touchend',e=>{const btn=INPUT_LOCK.downButton;if(!btn)return;e.preventDefault();clearPressedButton(btn);INPUT_LOCK.downButton=null;fireReliableButton(btn);},{capture:true,passive:false});
    document.addEventListener('touchcancel',e=>{clearPressedButton(INPUT_LOCK.downButton);INPUT_LOCK.downButton=null;},{capture:true,passive:false});
  }
}

function regionAt(x,y){
  const hits=WORLD_REGIONS.filter(r=>x>=r.x1&&x<=r.x2&&y>=r.y1&&y<=r.y2);
  hits.sort((a,b)=>((a.x2-a.x1)*(a.y2-a.y1))-((b.x2-b.x1)*(b.y2-b.y1)));
  return hits[0] || null;
}

    state.daily.lastLogin=key; state.daily.streak=streak; state.daily.chestClaimed=false; state.daily.questDone=false; state.daily.bossDone=false; state.daily.boost=dailyBoost();

function generateMap(){
  map = Array.from({length:MAP_H},()=>Array.from({length:MAP_W},()=>T.WATER));

  const set=(x,y,t)=>{if(inBounds(x,y))map[y][x]=t;};
  const paintEllipse=(cx,cy,rx,ry,t,noise=.18)=>{
    const x1=Math.max(1,Math.floor(cx-rx-2)), x2=Math.min(MAP_W-2,Math.ceil(cx+rx+2));

  const paintRect=(x1,y1,x2,y2,t)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,t)};

  paintEllipse(62,29,28,23,T.MOUNTAIN,.14);

  paintEllipse(108,76,28,22,T.DUNGEON,.12);
  paintEllipse(177,43,45,30,T.SWAMP,.16);
  paintEllipse(162,86,22,16,T.TOWN,.05);
  paintEllipse(45,126,28,20,T.WATER,.08);
  paintEllipse(44,126,35,27,T.GRASS,.05);
  paintEllipse(45,126,25,16,T.WATER,.05);
  paintEllipse(112,132,45,31,T.SAND,.14);
  paintEllipse(181,136,39,27,T.LAVA,.10);

  paintEllipse(96,58,13,10,T.TOWN,.05);
  paintEllipse(154,78,12,9,T.TOWN,.04);

  paintEllipse(78,94,15,9,T.WATER,.06);
  paintEllipse(132,61,17,10,T.WATER,.08);
  for(let x=62;x<150;x++){const y=Math.round(96+Math.sin(x*.13)*6); for(let w=-1;w<=1;w++)set(x,y+w,T.WATER);}
  for(let y=32;y<84;y++){const x=Math.round(142+Math.cos(y*.16)*4); set(x,y,T.WATER); if(y%3===0)set(x+1,y,T.WATER);}

  // Roads / bridges connecting every major area.

  drawRoad(45,126,39,132); drawRoad(52,30,43,52); drawRoad(43,52,12,16); drawRoad(174,52,198,24); drawRoad(181,136,204,151);
  drawRoad(20,83,66,88); drawRoad(66,88,108,76); drawRoad(112,132,130,148); drawRoad(162,86,151,78);

  // Place entrances and NPC towns must stay walkable.
  PLACES.forEach(p=>map[p.y][p.x]=T.DUNGEON);
  TREASURES.forEach(t=>{ if(map[t.y]?.[t.x]===T.WATER) map[t.y][t.x]=T.GRASS; });

function drawRoad(x1,y1,x2,y2){

}

function continuousMove(vx,vy,dt){
  if(inBattle||isOverlayOpen())return false;
  const mag=Math.hypot(vx,vy); if(mag<=0)return false;
  const p=state.player; p.fx=Number.isFinite(p.fx)?p.fx:p.x; p.fy=Number.isFinite(p.fy)?p.fy:p.y;
  const oldX=p.x, oldY=p.y;
  setFacingFromVector(vx,vy);
  const response=1-Math.exp(-dt*9.5);
  playerMotion.vx += (vx-playerMotion.vx)*response;
  playerMotion.vy += (vy-playerMotion.vy)*response;
  const speed=4.05;
  let nx=p.fx+playerMotion.vx*speed*dt, ny=p.fy+playerMotion.vy*speed*dt;
  let moved=false;
  if(canStandAt(nx,p.fy)){p.fx=nx;moved=true;} else playerMotion.vx*=.25;
  if(canStandAt(p.fx,ny)){p.fy=ny;moved=true;} else playerMotion.vy*=.25;
  p.fx=clamp(p.fx,0,MAP_W-1);p.fy=clamp(p.fy,0,MAP_H-1);
  p.x=clamp(Math.round(p.fx),0,MAP_W-1);p.y=clamp(Math.round(p.fy),0,MAP_H-1);
  if(moved)playerMotion.walk+=Math.hypot(playerMotion.vx,playerMotion.vy)*dt*5.5;
  if(p.x!==oldX||p.y!==oldY)onTileChanged();
  return moved;
}

  const goods={item:['potion','ether','megaPotion','antidote','campKit'],smith:['ironSword','ironArmor','copperRing','auroraBlade'],royal:['megaPotion','ether','frostRobe','moonDagger','braveBadge','dragonArmor','voidRing']}[kind]||[];

  modal.innerHTML=`<div class="modal"><h2>ショップ</h2><p>${state.player.gold}G</p><div class="grid">${goods.map(id=>{const obj=ITEMS[id]||EQUIP[id];return `<div class="card"><h3>${obj.name}</h3><p>${obj.desc||''}</p><p>${obj.price}G</p><button data-buy="${id}" ${state.player.gold>=obj.price?'':'disabled'}>買う</button></div>`}).join('')}</div><div class="btnrow"><button class="ghost" id="shopClose">閉じる</button></div></div>`;
  document.body.appendChild(modal); modal.querySelector('#shopClose').onclick=()=>modal.remove(); modal.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy, obj=ITEMS[id]||EQUIP[id]; if(state.player.gold<obj.price)return; state.player.gold-=obj.price; if(ITEMS[id])addItem(id,1); else addEquip(id); modal.remove(); openShop(kind)});
}

  document.body.appendChild(overlay);

  overlay.querySelector('#openingStart').onclick=finish;
}

function newGame(){const input=$('nicknameInput'); state=baseState(input?input.value:'こじこじ'); state.flags.openingSeen=false; generateMap(); camera.ready=false; miniDirty=true; $('titleOverlay').classList.remove('show'); $('logPanel').innerHTML=''; log(`${state.player.name}の冒険が始まった。`,'rare'); autosaveSoon(); showOpeningCrawl(()=>{});}
function continueGame(){if(load()){generateMap(); camera.ready=false; miniDirty=true; $('titleOverlay').classList.remove('show'); log('セーブデータを読み込みました。','good'); }else{loadFromIndexedDB(ok=>{if(ok){generateMap(); camera.ready=false; miniDirty=true; $('titleOverlay').classList.remove('show'); log('バックアップセーブを読み込みました。','good');}else toast('セーブデータがありません')})}}

function howTo(){
  $('menuOverlay').classList.add('show');
  $('menuContent').innerHTML=`<h2>遊び方 / 目的</h2><div class="grid"><div class="card"><h3>テーマ</h3><p>${STORY.theme}</p><p><b>最終目標：</b>${STORY.finalGoal}</p></div><div class="card"><h3>最初にやること</h3><p>左下のジョイスティックで動き、光のガイド矢印を追う。星のかけら → 宝箱 → 初戦闘 → 村長の順に進もう。</p></div><div class="card"><h3>操作</h3><p>左下のジョイスティックで移動。マップをタップすると自動移動。右下の大ボタンで会話・調べる・採集。</p></div><div class="card"><h3>進め方</h3><p>${STORY.route.map((r,i)=>`${i+1}. ${r}`).join('<br>')}</p></div><div class="card"><h3>やり込み</h3><p>宝箱、釣り、レリック、隠しボス、装備厳選、日替わり要素、称号、実績コンプリートを目指せる。</p></div></div><div class="btnrow"><button id="howClose">閉じる</button></div>`;
  $('howClose').onclick=closeMenu;
}


function doTouchAction(act){
  if(act==='interact'){interact();return;}
  if(act==='menu'){showMenu('status');return;}
  if(act==='story'){showMenu('story');return;}
  if(act==='quests'){showMenu('quests');return;}
  if(act==='card'){showMenu('card');return;}
  if(act==='map'){showMini=!showMini;toast('ミニマップ '+(showMini?'ON':'OFF'));return;}
  if(act==='save'){if(!isOverlayOpen()&&!inBattle)save();return;}
}
function dirVector(dir){return {up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir]||[0,0]}
function moveDir(dir){const [dx,dy]=dirVector(dir); if(dx||dy)move(dx,dy,dir)}
function resetJoystick(){
  joystick.active=false;joystick.id=null;joystick.x=0;joystick.y=0;joystick.rawX=0;joystick.rawY=0;
  const knob=$('joystickKnob'), wrap=$('joystick'); if(knob)knob.style.transform='translate(0,0)'; if(wrap)wrap.classList.remove('active');
}
function updateJoystick(e){
  const wrap=$('joystick'), knob=$('joystickKnob'); if(!wrap||!knob)return;
  const rect=wrap.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  const max=rect.width*.40;
  let dx=e.clientX-cx, dy=e.clientY-cy;
  const len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  joystick.rawX=dx/max;joystick.rawY=dy/max;
  const rawMag=Math.min(1,Math.hypot(joystick.rawX,joystick.rawY));
  const dead=.34;
  const power=rawMag<=dead?0:Math.pow((rawMag-dead)/(1-dead),1.55);
  const scale=rawMag?power/rawMag:0;
  joystick.x=joystick.rawX*scale;joystick.y=joystick.rawY*scale;
  knob.style.transform=`translate(${dx}px,${dy}px)`;
}
function bindJoystick(){
  const wrap=$('joystick'); if(!wrap)return;
  wrap.addEventListener('pointerdown',e=>{e.preventDefault();tapTarget=null;joystick.active=true;joystick.id=e.pointerId;wrap.classList.add('active');wrap.setPointerCapture(e.pointerId);updateJoystick(e)});
  wrap.addEventListener('pointermove',e=>{if(!joystick.active||e.pointerId!==joystick.id)return;e.preventDefault();updateJoystick(e)});
  const end=e=>{if(e&&joystick.id!==null&&e.pointerId!==joystick.id)return;if(e)e.preventDefault();resetJoystick();};
  wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);wrap.addEventListener('lostpointercapture',end);
}
function joystickMove(dt){
  if(!joystick.active||inBattle||isOverlayOpen())return false;
  const mag=Math.hypot(joystick.x,joystick.y); if(mag<.04)return false;
  const vx=joystick.x/mag*mag, vy=joystick.y/mag*mag;
  tapTarget=null;
  return continuousMove(vx,vy,dt);
}
function bindTouchControls(){
  bindJoystick();
  document.querySelectorAll('[data-act]').forEach(btn=>{
    btn.addEventListener('click',e=>{e.preventDefault();doTouchAction(btn.dataset.act)});
  });
  canvas.addEventListener('pointerdown',e=>{
    if(inBattle||isOverlayOpen())return;
    const rect=canvas.getBoundingClientRect();
    const sx=(e.clientX-rect.left)/rect.width*W, sy=(e.clientY-rect.top)/rect.height*H;
    const tx=Math.floor((sx+camera.x)/TILE), ty=Math.floor((sy+camera.y)/TILE);
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return;
    const p=state.player;
    const npc=NPCS.find(n=>n.x===tx&&n.y===ty), place=PLACES.find(d=>d.x===tx&&d.y===ty), treasure=TREASURES.find(t=>t.x===tx&&t.y===ty&&!state.flags.chests[t.id]);
    if((npc||place||treasure)&&Math.abs(tx-p.x)+Math.abs(ty-p.y)<=1){
      if(tx>p.x)p.dir='right'; else if(tx<p.x)p.dir='left'; else if(ty>p.y)p.dir='down'; else if(ty<p.y)p.dir='up';
      interact(); return;
    }
    if(passable.has(map[ty][tx])){tapTarget={x:tx,y:ty};tapTargetTime=performance.now();}
    else {tapTarget=null;toast('そこへは進めません');}
  });
}
function autoWalkToTapTarget(dt=1/60){
  if(!tapTarget||inBattle||isOverlayOpen())return;
  const p=state.player; p.fx=Number.isFinite(p.fx)?p.fx:p.x; p.fy=Number.isFinite(p.fy)?p.fy:p.y;
  const dx=tapTarget.x-p.fx, dy=tapTarget.y-p.fy, d=Math.hypot(dx,dy);
  if(d<.08){p.fx=tapTarget.x;p.fy=tapTarget.y;p.x=tapTarget.x;p.y=tapTarget.y;tapTarget=null;return;}
  if(performance.now()-tapTargetTime>18000){tapTarget=null;return;}
  const primaryX=Math.abs(dx)>=Math.abs(dy), tries=[];
  if(primaryX){tries.push([Math.sign(dx),dy/d]); if(Math.abs(dy)>.15)tries.push([0,Math.sign(dy)]);}
  else {tries.push([dx/d,Math.sign(dy)]); if(Math.abs(dx)>.15)tries.push([Math.sign(dx),0]);}
  for(const [mx,my] of tries){const len=Math.hypot(mx,my)||1; if(continuousMove(mx/len,my/len,dt))return;}
  tapTarget=null;toast('道がふさがっています');
}


function inputLoop(now=performance.now()){
  const dt=clamp((now-lastInputFrame)/1000,0,.05); lastInputFrame=now;
  if(!joystickMove(dt) && tapTarget)autoWalkToTapTarget(dt);
  requestAnimationFrame(inputLoop);
}

function bindCriticalButton(id, action){
  const btn=$(id); if(!btn)return;
  btn.__tapAction=()=>{ if(canFireButton(btn)) action(); };

  const trigger=(e)=>{
    if(btn.disabled)return;
    e.preventDefault(); e.stopPropagation();
    fireReliableButton(btn);
  };
  btn.addEventListener('touchend', trigger, {passive:false});
  btn.addEventListener('mouseup', trigger, false);
}

    if(e.target?.closest?.('button') || tag==='input') return;
    e.preventDefault();
    window.awazuStartNew();
  }, {passive:false});
}
bindTouchControls();
applySettings();
if(!hasSaveData()) $('continueGame').disabled=true;
generateMap(); state=baseState(); ensureDaily(); updatePanels(); draw(); inputLoop();
})();
